# Builds Obstat for Windows, Mac and Linux and puts it on the "desktop-preview"
# release, with latest.yml, latest-mac.yml and latest-linux.yml for the app's
# self-updaters (via obstat.app/update).
# Obstat-Setup.exe is a copy under a fixed name, for obstat.app's Download button.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a build still waiting for a runner
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # the token isn't left in .git/config, so install scripts and the build can't use it
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # every build gets its own version, so installed copies can see it's newer and update
      # (0.2.x: builds from this repo come after the 0.1.x builds made before it was public)
      - run: npm pkg set version=0.2.${{ github.run_number }}
        shell: bash
      - run: npm run dist
      - name: Check the self-updater's files were made
        shell: bash
        run: ls dist/latest.yml dist/Obstat-Setup-*.exe dist/Obstat-Setup-*.exe.blockmap
      - name: Publish the installer to the desktop-preview release
        # only merged code reaches people: pull requests build and test, but don't publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-preview >/dev/null 2>&1 || gh release create desktop-preview \
            --prerelease --target "${{ github.sha }}" --title "Obstat Desktop" \
            --notes "The latest build of Obstat Desktop for Windows. Download Obstat-Setup.exe and run it."
          exe="$(ls dist/Obstat-Setup-*.exe)"
          cp "$exe" dist/Obstat-Setup.exe
          gh release upload desktop-preview "$exe" "$exe.blockmap" dist/Obstat-Setup.exe --clobber
          # latest.yml goes last: it's what tells installed copies a new version is ready
          gh release upload desktop-preview dist/latest.yml --clobber
          # keep only this build's installer, so the release doesn't fill up with old ones
          keep="$(basename "$exe")"
          gh release view desktop-preview --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in Obstat-Setup.exe) ;; Obstat-Setup-*) [ "$name" = "$keep" ] || [ "$name" = "$keep.blockmap" ] || gh release delete-asset desktop-preview "$name" --yes ;; esac
          done

  # Mac: a .dmg for Apple Silicon and one for Intel. Ad-hoc signed (free, no Apple
  # account), so macOS asks people to confirm the first time they open it.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pkg set version=0.2.${{ github.run_number }}
      - run: npm run dist:mac
      - name: Check both apps were made and are signed, so Apple Silicon will open them
        run: |
          ls dist/Obstat-*-mac-arm64.dmg dist/Obstat-*-mac-x64.dmg dist/Obstat-*-mac-arm64.zip dist/Obstat-*-mac-x64.zip dist/latest-mac.yml
          for app in dist/mac-arm64/Obstat.app dist/mac/Obstat.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            lipo -archs "$app/Contents/MacOS/Obstat"
          done
      - name: Update an installed copy with this build, the way the Mac updater does
        run: node e2e/macupdate-check.js
      - name: Publish to the desktop-preview release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-preview >/dev/null 2>&1 || gh release create desktop-preview --prerelease --target "${{ github.sha }}" --title "Obstat Desktop" --notes "The latest build of Obstat Desktop." || true
          cp dist/Obstat-*-mac-arm64.dmg dist/Obstat-mac-arm64.dmg
          cp dist/Obstat-*-mac-x64.dmg dist/Obstat-mac-x64.dmg
          # the .zips are what Obstat's Mac updater downloads; the .dmgs under fixed names are for obstat.app
          gh release upload desktop-preview dist/Obstat-*-mac-*.zip dist/Obstat-mac-arm64.dmg dist/Obstat-mac-x64.dmg --clobber
          # latest-mac.yml goes last: it's what tells installed copies a new version is ready
          gh release upload desktop-preview dist/latest-mac.yml --clobber
          # keep only this build's update files
          keep="0.2.${{ github.run_number }}"
          gh release view desktop-preview --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in Obstat-*-mac-*.zip|Obstat-*-mac-*.zip.blockmap) case "$name" in Obstat-$keep-mac-*) ;; *) gh release delete-asset desktop-preview "$name" --yes ;; esac ;; esac
          done

  # Linux: an AppImage that runs on most distributions, and a .deb for Ubuntu and Debian.
  # Built on the oldest Ubuntu Obstat supports, so the bubblewrap it bundles runs there
  # and on everything newer.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # so the sandbox tests run inside real bubblewrap instead of skipping
      - run: sudo apt-get install -y bubblewrap
      - run: npm ci
      - run: npm test
      - run: npm pkg set version=0.2.${{ github.run_number }}
      - run: npm run dist:linux
      - name: Check the packages were made and the .deb opens obstat:// links
        run: |
          ls dist/Obstat-*-linux-x86_64.AppImage dist/Obstat-*-linux-amd64.deb dist/latest-linux.yml
          grep -q 'linux-amd64.deb' dist/latest-linux.yml
          dpkg-deb --fsys-tarfile dist/Obstat-*-linux-amd64.deb | tar -xO ./usr/share/applications/obstat.desktop | grep -x 'MimeType=x-scheme-handler/obstat;'
          dpkg-deb --fsys-tarfile dist/Obstat-*-linux-amd64.deb | tar -t | grep -x './opt/Obstat/resources/bwrap'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/Obstat-*-linux-amd64.deb
          retention-days: 3
      - name: Publish to the desktop-preview release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-preview >/dev/null 2>&1 || gh release create desktop-preview --prerelease --target "${{ github.sha }}" --title "Obstat Desktop" --notes "The latest build of Obstat Desktop." || true
          cp dist/Obstat-*-linux-x86_64.AppImage dist/Obstat-linux-x86_64.AppImage
          cp dist/Obstat-*-linux-amd64.deb dist/Obstat-linux-amd64.deb
          # versioned files for the updater (AppImage and .deb), fixed names for obstat.app
          gh release upload desktop-preview dist/Obstat-0.2.${{ github.run_number }}-linux-* dist/Obstat-linux-x86_64.AppImage dist/Obstat-linux-amd64.deb --clobber
          # latest-linux.yml goes last: it's what tells installed copies a new version is ready
          gh release upload desktop-preview dist/latest-linux.yml --clobber
          keep="0.2.${{ github.run_number }}"
          gh release view desktop-preview --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in Obstat-*.*.*-linux-*) case "$name" in Obstat-$keep-linux-*) ;; *) gh release delete-asset desktop-preview "$name" --yes ;; esac ;; esac
          done

  # Ubuntu 24.04 and later stop programs making user namespaces unless an AppArmor
  # profile allows it. Install the real .deb there and check that its profile lets
  # Obstat's own bubblewrap make a sandbox, for an ordinary user.
  linux-deb-check:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
      - name: Install the .deb and make a sandbox with Obstat's bubblewrap
        run: |
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          sudo apt-get install -y ./Obstat-*-linux-amd64.deb
          sudo aa-status | grep -q 'obstat-desktop-bwrap'
          # what lib/confine.js asks for: its own network and processes, a read-only system
          /opt/Obstat/resources/bwrap --die-with-parent --unshare-pid --unshare-net --unshare-ipc --ro-bind / / --dev /dev --proc /proc --tmpfs /home /bin/sh -c 'test ! -e /home/runner && echo sandbox ok'
          # and the system's own bubblewrap, without a profile, can't (so the check means something)
          sudo apt-get install -y bubblewrap
          ! /usr/bin/bwrap --unshare-net --ro-bind / / true 2>/dev/null
