<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Obstat</title>
  <link rel="stylesheet" href="obstat.css">
  <link rel="stylesheet" href="desktop.css">
  <link rel="stylesheet" href="glass.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell" id="shell">
    <header class="top">
      <div class="top-l">
        <a class="brand" href="#/home"><img class="logo" src="obstat.svg" alt="" width="24" height="24"><span>Obstat</span></a>
        <button class="tb" id="back" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="tb" id="fwd" title="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="tb" id="reload" title="Reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg></button>
      </div>
      <form class="search" id="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.6-4.6"/></svg>
        <input id="q" type="search" placeholder="Search apps, or paste a GitHub link" aria-label="Search apps, or paste a GitHub link" autocomplete="off" spellcheck="false">
      </form>
      <div class="top-r">
        <span class="online" id="online" title="Connection to the Obstat app list">Connecting…</span>
        <a class="btn small new" href="#/create"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New app</a>
      </div>
    </header>
    <aside class="side" id="side">
      <nav class="menu" aria-label="Sections">
        <a href="#/home" data-route="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg><span>Home</span></a>
        <a href="#/apps" data-route="apps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>My apps</span></a>
        <a href="#/discover" data-route="discover"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Discover</span></a>
        <a href="#/create" data-route="create"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg><span>Create</span></a>
        <a href="#/hub" data-route="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Community</span><span class="dot" id="newsdot" hidden></span></a>
        <a href="#/tools" data-route="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/></svg><span>Tools</span></a>
        <a href="#/insights" data-route="insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Insights</span></a>
      </nav>
      <nav class="menu foot" aria-label="More">
        <div class="running-box" id="running" hidden><b id="running-h"></b><div id="running-l"></div></div>
        <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"/></svg><span>Settings</span></a>
        <a href="#/help" data-route="help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5v.01"/></svg><span>Help</span></a>
        <button class="update-btn" id="updatebtn" hidden>Restart to update</button>
        <p class="ver" id="ver"></p>
      </nav>
    </aside>
    <div class="outage" id="outage" role="alert" hidden></div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</body>
</html>
